{% if page_obj.paginator.num_pages > 1 %}
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mt-3">
        <span class="text-muted small">
            第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页，共 {{ page_obj.paginator.count }} 条
        </span>
        <div class="d-flex gap-2">
            {% if page_obj.has_previous %}
                <a class="btn btn-sm btn-outline-secondary"
                   href="?{% if filter_query %}{{ filter_query }}&{% endif %}page={{ page_obj.previous_page_number }}">上一页</a>
            {% endif %}
            {% if page_obj.has_next %}
                <a class="btn btn-sm btn-outline-primary"
                   href="?{% if filter_query %}{{ filter_query }}&{% endif %}page={{ page_obj.next_page_number }}">下一页</a>
            {% endif %}
        </div>
    </div>
{% endif %}
